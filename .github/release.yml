# Configuration for GitHub's auto-generated release notes.
# Applied when a release is created with generated notes (see the
# "Release notes" workflow, or the "Generate release notes" button).
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: 🚀 New libraries
      labels:
        - new-library
    - title: ✨ Features
      labels:
        - feature
        - enhancement
    - title: 🐛 Fixes
      labels:
        - bug
        - fix
    - title: 📚 Documentation
      labels:
        - documentation
        - docs
    - title: ⬆️ Dependencies
      labels:
        - dependencies
    - title: 🔧 Other changes
      labels:
        - "*"
