name: Release notes

# Creates a GitHub Release with auto-generated, categorised notes whenever a
# version tag is pushed. Note categories are configured in .github/release.yml.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed through the environment, never interpolated into the script: a tag name may
          # contain shell metacharacters.
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists - skipping."
            exit 0
          fi

          flags=()

          # v2.0.0-preview.1 and the like are pre-releases.
          case "$TAG" in
            *-*) flags+=(--prerelease) ;;
          esac

          # Only the highest stable version is the "Latest" release. A patch on a maintenance
          # branch (v1.6.1 published after v2.0.0) must not take that label.
          highest=$(git tag --list 'v*' --sort=-v:refname | grep -v -- '-' | head -n 1)
          if [ "$TAG" != "$highest" ]; then
            flags+=(--latest=false)
          fi

          gh release create "$TAG" --verify-tag --generate-notes --title "$TAG" "${flags[@]}"
