name: Create Release

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

# The workflow never writes to the repository; NuGet publishing uses its own API key.
permissions:
  contents: read

jobs:
  build:
    name: Build, test and publish packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Protect this environment with required reviewers in the repository settings to gate publishing.
    environment: nuget
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The 11.0 SDK builds every target framework (net8.0 - net11.0). The tests run on net10.0 and
      # net11.0, so the 10.0 runtime has to be present as well - it comes with the 10.0 SDK.
      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Restore Workloads
        run: dotnet workload restore

      - name: Build and pack
        env:
          # Passed through the environment, never interpolated into the script: a tag name may
          # contain shell metacharacters.
          TAG: ${{ github.ref_name }}
        run: dotnet build TailoredApps.Shared.slnx -c Release -p:Version="${TAG#v}"

      - name: Test
        run: dotnet test TailoredApps.Shared.slnx -c Release --no-build

      # UseArtifactsOutput (Directory.Build.props) collects every package in one folder.
      # Every package is attempted so that one failure does not hide the state of the others, but the
      # job fails if any push failed: a release that published nothing must never look green.
      # --skip-duplicate makes a re-run safe after a partial publish.
      - name: Push packages to nuget.org
        working-directory: artifacts/package/release
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -uo pipefail
          shopt -s nullglob
          packages=(TailoredApps.Shared.*.nupkg)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "::error::No packages were produced."
            exit 1
          fi

          failed=0
          for package in "${packages[@]}"; do
            echo "::group::$package"
            if ! dotnet nuget push "$package" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate; then
              echo "::error::Failed to push $package"
              failed=$((failed + 1))
            fi
            echo "::endgroup::"
          done

          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed of ${#packages[@]} packages were not published."
            exit 1
          fi
          echo "Published ${#packages[@]} packages."
