name: Create Release

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

# The workflow never writes to the repository; NuGet publishing uses its own API key.
permissions:
  contents: read

jobs:
  build:
    name: Build, test and publish packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Protect this environment with required reviewers in the repository settings to gate publishing.
    environment: nuget
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Restore Workloads
        run: dotnet workload restore

      - name: Build and pack
        env:
          TAG: ${{ github.ref_name }}
        run: dotnet build TailoredApps.Shared.sln -c Release -p:Version="${TAG#v}"

      - name: Test
        run: dotnet test TailoredApps.Shared.sln -c Release --no-build

      - name: Push packages to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          packages=$(find src -path '*/bin/Release/TailoredApps.Shared.*.nupkg' | sort)
          if [ -z "$packages" ]; then
            echo "::error::No packages were produced."
            exit 1
          fi
          for package in $packages; do
            echo "Pushing $package"
            dotnet nuget push "$package" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
          done
