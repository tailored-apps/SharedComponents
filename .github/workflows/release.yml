on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10
name: Create Release
jobs:
  build:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

        # Install .NET Core SDK
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Dotnet Pack
      working-directory: .
      run: dotnet build TailoredApps.Shared.slnx -c Release -p:Version=${GITHUB_REF##*/v}

    # UseArtifactsOutput (Directory.Build.props) collects every package in one folder.
    # Each package is pushed on its own so that one failure (for example a version that
    # is already published) does not stop the remaining packages from being released.
    - name: Dotnet Nuget Push
      working-directory: artifacts/package/release
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      run: |
        for package in TailoredApps.Shared.*.nupkg; do
          echo "::group::$package"
          if ! dotnet nuget push "$package" -s https://api.nuget.org/v3/index.json -k "$NUGET_API_KEY"; then
            echo "::warning::Failed to push $package"
          fi
          echo "::endgroup::"
        done
