name: Build & Test PR

on:
  pull_request:
    branches: [ master, 'release/**' ]

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The 11.0 SDK builds both target frameworks (net10.0 and net11.0). The tests run on net10.0 and
      # net11.0, so the 10.0 runtime has to be present as well - it comes with the 10.0 SDK.
      - name: Setting up .NET SDKs (10.0.x for the net10.0 test runtime, 11.0.x to build)
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Restore Workloads
        run: dotnet workload restore

      # ValidatePublicApi compares every library, while it is packed, with the baseline version of the same
      # package on nuget.org (PublicApiBaselineVersion in src/Directory.Build.targets) and fails the build on
      # a breaking change. The baseline packages are downloaded by restore, so both steps get the switch.
      - name: Restoring Packages
        run: dotnet restore TailoredApps.Shared.slnx -p:ValidatePublicApi=true

      - name: Building Solution (public API compared with the published baseline)
        run: dotnet build TailoredApps.Shared.slnx --configuration Release --no-restore -p:ValidatePublicApi=true

      - name: Testing
        run: dotnet test TailoredApps.Shared.slnx --no-build --configuration Release --no-restore --verbosity normal /p:CollectCoverage=true /p:CoverletOutputFormat="opencover"

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # The libraries that declare IsAotCompatible, used by a console application that is compiled to native
  # code and run. The analyzers in the build above only see one library at a time; the AOT compiler sees
  # the whole dependency closure (every trim and AOT warning is an error in that project), and running the
  # result shows what trimming removed. net10.0 has compiler-generated async state machines, net11.0
  # runtime async - both have to work natively.
  native-aot:
    name: NativeAOT smoke test (${{ matrix.framework }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        framework: [ net10.0, net11.0 ]
    env:
      FRAMEWORK: ${{ matrix.framework }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setting up .NET SDK 11.0.x
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 11.0.x

      - name: Installing the native toolchain (clang, zlib)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      - name: Publishing with NativeAOT
        run: dotnet publish tests/TailoredApps.Shared.AotSmoke -c Release -f "$FRAMEWORK" -r linux-x64

      - name: Running the native application
        run: ./artifacts/publish/TailoredApps.Shared.AotSmoke/release_${FRAMEWORK}_linux-x64/TailoredApps.Shared.AotSmoke
