name: Build & Test PR

on:
  pull_request:
    branches: [ master, 'release/**' ]

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The 11.0 SDK builds both target frameworks (net10.0 and net11.0). The tests run on net10.0 and
      # net11.0, so the 10.0 runtime has to be present as well - it comes with the 10.0 SDK.
      - name: Setting up .NET SDKs (10.0.x for the net10.0 test runtime, 11.0.x to build)
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Restore Workloads
        run: dotnet workload restore

      # ValidatePublicApi compares every library, while it is packed, with the baseline version of the same
      # package on nuget.org (PublicApiBaselineVersion in src/Directory.Build.targets) and fails the build on
      # a breaking change. The baseline packages are downloaded by restore, so both steps get the switch.
      - name: Restoring Packages
        run: dotnet restore TailoredApps.Shared.slnx -p:ValidatePublicApi=true

      - name: Building Solution (public API compared with the published baseline)
        run: dotnet build TailoredApps.Shared.slnx --configuration Release --no-restore -p:ValidatePublicApi=true

      - name: Testing
        run: dotnet test TailoredApps.Shared.slnx --no-build --configuration Release --no-restore --verbosity normal /p:CollectCoverage=true /p:CoverletOutputFormat="opencover"

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # The libraries that declare IsAotCompatible, used by two applications that are compiled to native code and
  # run: a console one (payments, options, signatures) and a minimal-API one (WebApi defaults, exception
  # handling, e-mail, [Authorize] with a JWT). The analyzers in the build above only see one library at a
  # time; the AOT compiler sees the whole dependency closure (every trim and AOT warning is an error in those
  # projects), and running the result shows what trimming removed. net10.0 has compiler-generated async state
  # machines, net11.0 runtime async - both have to work natively, on Linux and on Windows.
  native-aot:
    name: NativeAOT smoke test (${{ matrix.framework }}, ${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        framework: [ net10.0, net11.0 ]
        os: [ ubuntu-24.04, windows-2025 ]
        include:
          - os: ubuntu-24.04
            rid: linux-x64
            exe: ''
          - os: windows-2025
            rid: win-x64
            exe: '.exe'
    env:
      FRAMEWORK: ${{ matrix.framework }}
      RID: ${{ matrix.rid }}
      EXE: ${{ matrix.exe }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setting up .NET SDK 11.0.x
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 11.0.x

      # Windows runners ship the C++ build tools NativeAOT links with; Linux needs clang and zlib.
      - name: Installing the native toolchain (clang, zlib)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      # The .NET 10 AOT compiler locates the linker with a script that calls vswhere.exe by its bare name.
      # Depending on the Visual Studio version it is not on the PATH, and publishing net10.0 then fails.
      - name: Putting vswhere on the PATH
        if: runner.os == 'Windows'
        run: echo 'C:\Program Files (x86)\Microsoft Visual Studio\Installer' >> "$GITHUB_PATH"

      - name: Publishing the console application with NativeAOT
        run: dotnet publish tests/TailoredApps.Shared.AotSmoke -c Release -f "$FRAMEWORK" -r "$RID"

      - name: Running the native console application
        run: ./artifacts/publish/TailoredApps.Shared.AotSmoke/release_${FRAMEWORK}_${RID}/TailoredApps.Shared.AotSmoke${EXE}

      - name: Publishing the Web API application with NativeAOT
        run: dotnet publish tests/TailoredApps.Shared.AotSmoke.Web -c Release -f "$FRAMEWORK" -r "$RID"

      - name: Running the native Web API application
        run: ./artifacts/publish/TailoredApps.Shared.AotSmoke.Web/release_${FRAMEWORK}_${RID}/TailoredApps.Shared.AotSmoke.Web${EXE}

      # The response cache has its own application: Microsoft.Extensions.Caching.Hybrid still reports trim and
      # AOT warnings for a JSON fallback the application does not use. Those are let through as warnings, and
      # this step fails when a warning of that kind names anything else - a library of this repository above all.
      - name: Publishing the response cache application with NativeAOT
        run: |
          dotnet publish tests/TailoredApps.Shared.AotSmoke.Caching -c Release -f "$FRAMEWORK" -r "$RID" | tee aot-caching-publish.log
          if grep -E 'warning IL[0-9]+' aot-caching-publish.log | grep -v 'Microsoft\.Extensions\.Caching\.Hybrid'; then
            echo '::error::A trim or AOT warning outside Microsoft.Extensions.Caching.Hybrid (listed above).'
            exit 1
          fi

      - name: Running the native response cache application
        run: ./artifacts/publish/TailoredApps.Shared.AotSmoke.Caching/release_${FRAMEWORK}_${RID}/TailoredApps.Shared.AotSmoke.Caching${EXE}
