name: Build & Test PR

on:
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Build and test
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      # The 11.0 SDK builds every target framework (net8.0 - net11.0). The tests run on net10.0 and
      # net11.0, so the 10.0 runtime has to be present as well - it comes with the 10.0 SDK.
      - name: Setting up .NET SDKs (10.0.x for the net10.0 test runtime, 11.0.x to build)
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Restore Workloads
        run: dotnet workload restore

      - name: Restoring Packages
        run: dotnet restore

      - name: Building Solution
        run: dotnet build TailoredApps.Shared.sln --configuration Release --no-restore 

      - name: Testing
        run: dotnet test --no-build --configuration Release --no-restore --verbosity normal /p:CollectCoverage=true /p:CoverletOutputFormat="opencover"

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
