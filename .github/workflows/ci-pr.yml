name: Build & Test PR

on:
  pull_request:
    branches: [ master ]

env:
  NETCORE_VERSION: '10.0.x'

jobs:
  build:
    name: Build and test
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      - name: Setting up .NET Core SDK ${{ env.NETCORE_VERSION }}...
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.NETCORE_VERSION }}

      - name: Restore Workloads
        run: dotnet workload restore

      - name: Restoring Packages
        run: dotnet restore TailoredApps.Shared.slnx

      - name: Building Solution
        run: dotnet build TailoredApps.Shared.slnx --configuration Release --no-restore

      - name: Testing
        run: dotnet test TailoredApps.Shared.slnx --no-build --configuration Release --no-restore --verbosity normal /p:CollectCoverage=true /p:CoverletOutputFormat="opencover"

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
