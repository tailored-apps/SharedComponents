name: 'Bump dependencies'

on:
  workflow_dispatch:
    inputs:
      allowed-licenses:
        description: 'Comma-separated SPDX allowlist'
        required: false
        default: 'MIT,Apache-2.0'
      dry-run:
        description: 'Dry run (no commits, no PR)'
        required: false
        default: 'false'
  schedule:
    # Weekly, Mondays at 06:00 UTC
    - cron: '0 6 * * 1'

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      ALLOWED_LICENSES: ${{ github.event.inputs.allowed-licenses || 'MIT,Apache-2.0' }}
      DRY_RUN: ${{ github.event.inputs.dry-run || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          # 11.0.x builds every target framework; 10.0.x supplies the runtime for the net10.0 tests.
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Run bump script
        id: bump
        shell: pwsh
        env:
          RECORDS_PATH: ${{ runner.temp }}/bump-records.json
        run: |
          $licenses = $env:ALLOWED_LICENSES -split ','
          $dryRun = $env:DRY_RUN -eq 'true'
          $scriptArgs = @{
            AllowedLicenses = $licenses
            GithubOutput    = $true
            RecordsPath     = $env:RECORDS_PATH
          }
          if ($dryRun) { $scriptArgs.DryRun = $true }
          ./scripts/Bump-Deps.ps1 @scriptArgs

      # The "Docs guard" workflow rejects any PR that touches src/ without touching
      # docs/ + docs-en/, so the bump PR has to carry its own documentation entry.
      - name: Generate dependency documentation
        if: steps.bump.outputs.bumped == 'true' && env.DRY_RUN != 'true'
        shell: pwsh
        env:
          RECORDS_PATH: ${{ runner.temp }}/bump-records.json
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ./scripts/New-BumpDocs.ps1 -RecordsPath $env:RECORDS_PATH -RunUrl $env:RUN_URL
          git --no-pager diff --stat -- docs docs-en

      # PRs opened with GITHUB_TOKEN do not trigger the pull_request workflows, so the bump
      # is verified here: restore, build and the full test suite must pass before a PR exists.
      - name: Verify build and tests
        if: steps.bump.outputs.bumped == 'true' && env.DRY_RUN != 'true'
        run: |
          dotnet workload restore
          dotnet restore TailoredApps.Shared.slnx
          dotnet build TailoredApps.Shared.slnx --no-restore --nologo
          dotnet test TailoredApps.Shared.slnx --no-build --nologo

      - name: Create pull request
        if: steps.bump.outputs.bumped == 'true' && env.DRY_RUN != 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          commit-message: 'chore(deps): automated dependency bump'
          title: 'chore(deps): automated dependency bump'
          body: |
            Automated bump produced by `.github/workflows/bump-deps.yml`.

            Allowed licenses: `${{ env.ALLOWED_LICENSES }}`

            ### Bumps and skips
            See workflow run log for the full BUMP/SKIP report, and the generated
            entry in `docs/Dependencies/index.md` / `docs-en/Dependencies/index.md`
            for the per-project package list.
            Packages with license drift or licenses outside the allowlist are skipped automatically.

            ### Test plan
            - [x] `dotnet restore` (workflow)
            - [x] `dotnet build` (workflow)
            - [x] `dotnet test` (workflow)
            - [x] Dependency docs regenerated (`scripts/New-BumpDocs.ps1`)
            - [ ] Spot-check API surface for any breaking changes
          branch: chore/auto-bump-deps
          base: master
          delete-branch: true
          labels: dependencies, automated
